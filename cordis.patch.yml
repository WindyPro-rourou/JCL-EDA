# @windypro-rourou/dsh-eda bundle patch: inserts the JCL-EDA plugin row into
# the web profile roster. Applied as a profile bundle layer over dsh-base.
# Install: npm i @windypro-rourou/dsh-eda (or git: github:WindyPro-rourou/JCL-EDA)
# into the profile's node_modules, then insert the row below and restart the
# DSH Web GUI. The node half (exports ".") runs in the host process
# (/api/dsh-eda routes, agent tools, system-prompt section); the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/@windypro-rourou/dsh-eda/client.js) load in the web GUI.
- insert:
    - id: eda
      name: '@windypro-rourou/dsh-eda'
